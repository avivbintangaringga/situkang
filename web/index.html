<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('situkang-theme')
          // Dark is the default; only an explicit "light" choice opts out.
          if (stored !== 'light') document.documentElement.classList.add('dark')
        } catch (error) {
          /* storage unavailable */
        }
      })()
    </script>
    <title>SiTukang</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
